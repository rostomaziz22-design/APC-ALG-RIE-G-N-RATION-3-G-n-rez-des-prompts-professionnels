<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/><stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
    <radialGradient id="earthGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#3fd0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="comicBorder"><feMorphology operator="dilate" radius="3" in="SourceAlpha"/><feFlood flood-color="#111"/><feComposite in2="SourceAlpha" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowFilter"><feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <!-- Fond ciel étoilé -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="120" cy="60" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="350" cy="40" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="600" cy="80" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="700" cy="30" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="250" cy="120" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="500" cy="50" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="150" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="680" cy="140" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- Lueur terrestre -->
  <rect width="800" height="500" fill="url(#earthGlow)"/>
  <!-- Terre (courbe) -->
  <ellipse cx="400" cy="550" rx="380" ry="300" fill="#0f5a8a"/>
  <ellipse cx="400" cy="550" rx="380" ry="300" fill="#1c7fb8" opacity="0.5"/>
  <!-- Continents -->
  <ellipse cx="280" cy="320" rx="80" ry="40" fill="#1a7a48" transform="rotate(-10 280 320)"/>
  <ellipse cx="350" cy="280" rx="50" ry="25" fill="#1a7a48" transform="rotate(15 350 280)"/>
  <ellipse cx="450" cy="350" rx="70" ry="35" fill="#1a7a48" transform="rotate(20 450 350)"/>
  <ellipse cx="200" cy="380" rx="45" ry="20" fill="#1a7a48" transform="rotate(-5 200 380)"/>
  <ellipse cx="520" cy="310" rx="55" ry="28" fill="#1a7a48" transform="rotate(-15 520 310)"/>
  <!-- Météorite (gros plan dramatique) -->
  <g filter="url(#shadowFilter)">
    <circle cx="600" cy="100" r="45" fill="#8b4513"/>
    <circle cx="580" cy="85" r="12" fill="#6b3410"/>
    <circle cx="615" cy="110" r="15" fill="#6b3410"/>
    <circle cx="590" cy="120" r="8" fill="#5a2a0e"/>
    <circle cx="620" cy="85" r="6" fill="#5a2a0e"/>
    <circle cx="600" cy="100" r="45" fill="none" stroke="#ffdca8" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- Traînée de feu -->
  <ellipse cx="680" cy="80" rx="60" ry="8" fill="#ff6b2a" opacity="0.7" transform="rotate(-20 680 80)"/>
  <ellipse cx="720" cy="65" rx="45" ry="5" fill="#ffa03a" opacity="0.5" transform="rotate(-20 720 65)"/>
  <ellipse cx="750" cy="55" rx="30" ry="3" fill="#ffd23b" opacity="0.3" transform="rotate(-20 750 55)"/>
  <!-- Bulle de texte style comics -->
  <rect x="30" y="20" width="280" height="60" rx="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="170" y="48" font-family="Impact,sans-serif" font-size="20" fill="#d32" text-anchor="middle" font-weight="bold">ALERTE IMPACT !</text>
  <text x="170" y="68" font-family="Arial,sans-serif" font-size="12" fill="#333" text-anchor="middle">Objet en approche rapide</text>
  <!-- Deuxième bulle -->
  <rect x="520" y="160" width="250" height="55" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <polygon points="560,215 540,240 580,215" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="645" y="185" font-family="Arial,sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Activation bouclier orbital</text>
  <text x="645" y="203" font-family="Arial,sans-serif" font-size="11" fill="#666" text-anchor="middle">Système de défense en ligne</text>
  <!-- Texte narratif en bas -->
  <rect x="50" y="420" width="700" height="60" rx="8" fill="rgba(0,0,0,0.75)" stroke="#4de3ff" stroke-width="1.5"/>
  <text x="400" y="442" font-family="Georgia,serif" font-size="14" fill="#dce6ff" text-anchor="middle">Une météorite de taille cataclysmique fonce vers la Terre.</text>
  <text x="400" y="462" font-family="Georgia,serif" font-size="14" fill="#4de3ff" text-anchor="middle">Le sort de l'humanité repose sur tes compétences, Commandant.</text>
</svg>