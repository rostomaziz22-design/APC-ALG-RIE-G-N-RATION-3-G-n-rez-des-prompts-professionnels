<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APC Algérie G3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }

        .screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }
        .screen.vis {
            opacity: 1;
            pointer-events: auto;
        }

        /* SCREEN 1 — Graphe + Assistant */
        #s1 .cardio-row {
            display: flex;
            align-items: center;
            width: min(540px, 92vw);
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #s1 .cardio-row.show { opacity: 1; }
        #s1 .cardio-wrap {
            position: relative;
            flex: 1;
            height: 44px;
            min-width: 0;
        }
        #s1 .cardio-wrap .cardio-svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        #s1 .cardio-wrap .cardio-cover {
            position: absolute;
            top: 0; right: 0;
            height: 100%;
            width: 100%;
            background: #000;
            transition: width 2.8s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        #s1 .cardio-wrap .cardio-cover.go { width: 0%; }
        #s1 .assistant-text {
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-left: 10px;
            color: rgba(255,255,255,0.85);
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #s1 .assistant-text.show { opacity: 1; }

        /* SCREEN 2 — Logo */
        #s2 .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }
        #s2 .logo-wrap.show {
            opacity: 1;
            transform: scale(1);
        }
        #s2 .logo-wrap img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            padding: 6px;
            box-shadow: 0 0 50px rgba(0,150,255,0.3);
            margin-bottom: 20px;
        }
        #s2 .logo-wrap .ministere-name {
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-align: center;
            max-width: 360px;
            line-height: 1.5;
        }
        #s2 .logo-wrap .apc-sub {
            color: rgba(255,255,255,0.2);
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 16px;
        }

        /* SCREEN 3 — Chargement */
        #s3 .loading-text {
            color: rgba(255,255,255,0.15);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            #s1 .cardio-row { width: min(350px, 92vw); }
            #s1 .cardio-wrap { height: 32px; }
            #s1 .cardio-wrap .cardio-cover { transition-duration: 1.8s; }
            #s1 .assistant-text { font-size: 0.65rem; letter-spacing: 1px; margin-left: 6px; }
            #s2 .logo-wrap img { width: 72px; height: 72px; }
        }
    </style>
</head>
<body>
<div id="apcCompatBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(135deg,#E65100,#FF8F00);color:#fff;padding:10px 16px;text-align:center;font-size:13px;font-weight:500;box-shadow:0 2px 12px rgba(0,0,0,.3);align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;"><i class="fas fa-exclamation-triangle" style="font-size:16px;"></i> <span>Mode de compatibilité activé pour votre navigateur. Certaines icônes peuvent être différentes.</span> <button id="apcCompatBannerClose" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;padding:4px 14px;border-radius:14px;font-size:12px;cursor:pointer;">OK</button></div>
    <!-- SCREEN 1 — Graphe + Assistant -->
    <div id="s1" class="screen vis">
        <div class="cardio-row">
            <div class="cardio-wrap">
                <div class="cardio-cover"></div>
                <svg viewBox="0 0 400 50" preserveAspectRatio="xMidYMid meet" class="cardio-svg">
                    <defs>
                        <linearGradient id="dzGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#006233" />
                            <stop offset="50%" stop-color="#FFFFFF" />
                            <stop offset="100%" stop-color="#D21034" />
                        </linearGradient>
                    </defs>
                    <path d="M 0,35
                        C 14,35 18,35 22,35 C 23,28 25,28 26,35 C 28,35 31,2 34,2 C 37,2 40,35 42,35 C 46,35 50,23 54,23 C 58,23 62,35 66,35 C 78,35 88,35 100,35
                        C 114,35 118,35 122,35 C 123,28 125,28 126,35 C 128,35 131,2 134,2 C 137,2 140,35 142,35 C 146,35 150,23 154,23 C 158,23 162,35 166,35 C 178,35 188,35 200,35
                        C 214,35 218,35 222,35 C 223,28 225,28 226,35 C 228,35 231,2 234,2 C 237,2 240,35 242,35 C 246,35 250,23 254,23 C 258,23 262,35 266,35 C 278,35 288,35 300,35
                        C 314,35 318,35 322,35 C 323,28 325,28 326,35 C 328,35 331,2 334,2 C 337,2 340,35 342,35 C 346,35 350,23 354,23 C 358,23 362,35 366,35 C 378,35 388,35 400,35"
                        fill="none" stroke="url(#dzGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="assistant-text">Assistant APC Algérie G3</div>
        </div>
    </div>

    <!-- SCREEN 2 — Logo -->
    <div id="s2" class="screen">
        <div class="logo-wrap">
            <img src="https://mvet.gov.dz/wp-content/uploads/2024/03/logo-mfep-1.png" alt="MFEP">
            <div class="ministere-name">Ministère de la Formation et de l'Enseignement Professionnels</div>
            <div class="apc-sub">APC Algérie · Génération 3</div>
        </div>
    </div>

    <!-- SCREEN 3 — Chargement -->
    <div id="s3" class="screen">
        <div class="loading-text">Chargement...</div>
    </div>

    <script>
        (function() {
            var s1 = document.getElementById('s1');
            var s2 = document.getElementById('s2');
            var s3 = document.getElementById('s3');
            var row = s1.querySelector('.cardio-row');
            var cover = s1.querySelector('.cardio-cover');
            var atext = s1.querySelector('.assistant-text');
            var logow = s2.querySelector('.logo-wrap');
            var isMob = window.innerWidth < 600;
            var tDraw = isMob ? 1800 : 2800;
            var tTextOff = isMob ? 200 : 400;
            var t1 = 800 + tDraw + 600;

            // Démarrer le graphe immédiatement
            setTimeout(function() { row.classList.add('show'); }, 100);
            setTimeout(function() { cover.classList.add('go'); }, 800);
            setTimeout(function() { atext.classList.add('show'); }, 800 + tDraw - tTextOff);

            // S1 → S2 (Logo)
            setTimeout(function() {
                s1.classList.remove('vis');
                setTimeout(function() {
                    s2.classList.add('vis');
                    setTimeout(function() { logow.classList.add('show'); }, 100);
                }, 550);
            }, t1);

            // S2 → S3
            var t2 = isMob ? 1500 : 2000;
            setTimeout(function() {
                s2.classList.remove('vis');
                setTimeout(function() { s3.classList.add('vis'); }, 550);
            }, t1 + t2 + 100);

            // S3 → index.html
            var t3 = isMob ? 1000 : 1500;
            var total = t1 + t2 + 100 + 550 + t3;
            setTimeout(function() {
                window.location.href = 'index.html';
            }, total);
        })();
    </script>
</body>
</html>
