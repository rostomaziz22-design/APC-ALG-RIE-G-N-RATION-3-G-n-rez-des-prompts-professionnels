<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co https://openrouter.ai https://api.groq.com https://generativelanguage.googleapis.com https://api.emailjs.com https://api.ipify.org https://ipinfo.io https://ip-api.com https://image.pollinations.ai https://gen.pollinations.ai https://commons.wikimedia.org https://fr.wikipedia.org https://en.wikipedia.org https://upload.wikimedia.org; img-src 'self' data: https:; media-src 'self' https:; base-uri 'self';">
<title>Sessions actives</title>
<link rel="stylesheet" href="css/style.css">
<style>
  :root{--bg:#0a0f1e;--card:#12192d;--border:rgba(255,255,255,.08);--text:#e8edf5;--text-muted:rgba(255,255,255,.4)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{padding:16px;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
  .page-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .page-header h1{font-size:1.5rem;margin:0;display:flex;align-items:center;gap:8px}
  .page-header .actions{display:flex;gap:8px;margin-left:auto}
  .btn{padding:9px 20px;border:none;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none}
  .btn-primary{background:linear-gradient(135deg,#0077CC,#00B4D8);color:#fff}
  .btn-secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
  .sessions-list{display:flex;flex-direction:column;gap:8px}
  .session-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--border);border-radius:12px;background:var(--card);transition:box-shadow .2s}
  .session-card:hover{border-color:rgba(0,119,204,.3)}
  .dot{width:12px;height:12px;border-radius:50%;background:#28a745;flex-shrink:0;animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,167,69,.6)}50%{box-shadow:0 0 0 6px rgba(40,167,69,.15)}100%{box-shadow:0 0 0 0 rgba(40,167,69,.6)}}
  .session-name{flex:1;font-weight:600;font-size:.95rem}
  .session-time{color:var(--text-muted);font-size:.78rem}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .empty-state .icon{font-size:3rem;margin-bottom:12px}
  .empty-state p{font-size:1.1rem}
  .count-badge{font-size:.9rem;color:var(--text-muted);font-weight:400}
  .status-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 16px;background:var(--card);border-radius:10px;border:1px solid var(--border);font-size:.82rem;color:var(--text-muted)}
</style>
</head>
<body>
<div class="page-header">
  <h1>🟢 Sessions actives <span class="count-badge" id="sessionsCount"></span></h1>
  <div class="actions">
    <button class="btn btn-primary" onclick="loadSessions()">🔄 Actualiser</button>
    <a href="admin.html" class="btn btn-secondary" style="text-decoration:none;">⬅ Retour admin</a>
  </div>
</div>
<div class="status-bar">
  <span class="live" style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:#28a745;animation:pulse 1.5s infinite;display:inline-block;"></span>Mise à jour automatique toutes les 15s</span>
  <span style="margin-left:auto;" id="lastUpdate">—</span>
</div>
<div id="sessionsContainer" class="sessions-list"></div>


<script>
var ADMIN_PROJECT = 'zheglrzqzwopcfsdbztc';
var SUPABASE_ANON_KEY = 'sb_publishable_fbnRXgRq0ipF-Y97PEZYCw_pheHamr7';
var srKeyMemory = localStorage.getItem('sb_sr_key') || '';
function getSrKey() { return srKeyMemory || ''; }

function loadSessions() {
  var container = document.getElementById('sessionsContainer');
  var countEl = document.getElementById('sessionsCount');
  var lastEl = document.getElementById('lastUpdate');
  var srKey = getSrKey();
  if (!srKey) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🔑</div><p>Configurez la clé service_role dans l\'admin</p></div>';
    return;
  }
  var cutoff = new Date(Date.now() - 120000).toISOString();
  fetch('https://' + ADMIN_PROJECT + '.supabase.co/rest/v1/profiles?select=id,full_name,last_active&last_active=gt.' + cutoff + '&order=last_active.desc', {
    headers: { 'Authorization': 'Bearer ' + srKey, 'apikey': SUPABASE_ANON_KEY }
  }).then(function(r) { return r.json(); }).then(function(profs) {
    countEl.textContent = '(' + (profs||[]).length + ')';
    lastEl.textContent = 'Dernière màj : ' + new Date().toLocaleString('fr-FR');
    if (!profs || profs.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">😴</div><p>Personne actuellement sur la plateforme</p></div>';
      return;
    }
    var html = '';
    profs.forEach(function(p) {
      var since = p.last_active ? new Date(p.last_active).toLocaleString('fr-FR') : '—';
      var email = p.id.slice(0,8);
      html += '<div class="session-card">'
        + '<span class="dot"></span>'
        + '<div style="flex:1;min-width:0;">'
        + '<div class="session-name">' + (p.full_name || email) + '</div>'
        + '</div>'
        + '<div style="text-align:right;">'
        + '<div class="session-time">📌 ' + since + '</div>'
        + '</div>'
        + '</div>';
    });
    container.innerHTML = html;
  }).catch(function(e) {
    container.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>Erreur : ' + e.message + '</p></div>';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  loadSessions();
  setInterval(loadSessions, 15000);
});
</script>
</body>
</html>
