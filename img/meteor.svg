<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="rock" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c87840"/>
      <stop offset="30%" stop-color="#a05428"/>
      <stop offset="60%" stop-color="#78381a"/>
      <stop offset="100%" stop-color="#4a2010"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,200,100,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,100,30,0)"/>
    </radialGradient>
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="rgba(255,150,50,0)"/>
      <stop offset="82%" stop-color="rgba(255,200,100,0.15)"/>
      <stop offset="92%" stop-color="rgba(255,120,30,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,80,20,0)"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="55" cy="55" r="38" fill="rgba(255,120,40,0.08)"/>
  <circle cx="55" cy="55" r="30" fill="url(#rimGlow)"/>
  <!-- Core glow -->
  <circle cx="55" cy="55" r="22" fill="url(#coreGlow)"/>
  <!-- Main rock body -->
  <path d="M42,40 Q50,34 60,36 Q68,34 74,40 Q78,46 76,54 Q78,62 74,68 Q68,74 60,76 Q52,74 46,70 Q40,64 38,56 Q36,48 42,40Z" fill="url(#rock)" stroke="#5a2810" stroke-width="0.5"/>
  <!-- Surface details -->
  <ellipse cx="50" cy="48" rx="6" ry="4" fill="#68301a" opacity="0.4" transform="rotate(-15,50,48)"/>
  <ellipse cx="65" cy="52" rx="5" ry="3.5" fill="#68301a" opacity="0.35" transform="rotate(10,65,52)"/>
  <ellipse cx="56" cy="62" rx="4" ry="3" fill="#68301a" opacity="0.3" transform="rotate(-5,56,62)"/>
  <ellipse cx="60" cy="42" rx="3.5" ry="2.5" fill="#7a4020" opacity="0.25" transform="rotate(20,60,42)"/>
  <ellipse cx="45" cy="58" rx="3" ry="2" fill="#7a4020" opacity="0.2" transform="rotate(-25,45,58)"/>
  <ellipse cx="70" cy="60" rx="2.5" ry="1.8" fill="#7a4020" opacity="0.2"/>
  <!-- Highlight -->
  <ellipse cx="48" cy="42" rx="8" ry="5" fill="rgba(255,220,180,0.08)" transform="rotate(-20,48,42)"/>
  <!-- Cracks -->
  <path d="M48,44 Q52,48 50,54" stroke="#3a1a0a" stroke-width="0.6" fill="none" opacity="0.3"/>
  <path d="M62,46 Q66,50 64,56" stroke="#3a1a0a" stroke-width="0.5" fill="none" opacity="0.25"/>
  <path d="M54,64 Q58,66 62,64" stroke="#3a1a0a" stroke-width="0.4" fill="none" opacity="0.2"/>
  <!-- Fire glow on leading edge -->
  <ellipse cx="42" cy="50" rx="8" ry="12" fill="rgba(255,160,60,0.12)" transform="rotate(-10,42,50)"/>
</svg>