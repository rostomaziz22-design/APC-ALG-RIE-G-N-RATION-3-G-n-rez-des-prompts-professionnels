  <path d="M98 140 L98 15" stroke="#5a9e2a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Leaves -->
  <ellipse cx="60" cy="90" rx="20" ry="11" fill="#3d8a1a" transform="rotate(-30 60 90)"/>
