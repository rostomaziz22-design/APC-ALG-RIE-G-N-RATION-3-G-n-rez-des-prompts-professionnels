<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a5a8a"/>
      <stop offset="50%" stop-color="#2a4a7a"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6a9a"/>
      <stop offset="100%" stop-color="#2a4a7a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9aba"/>
      <stop offset="100%" stop-color="#5a6a8a"/>
    </linearGradient>
  </defs>
  <!-- Solar panels -->
  <rect x="6" y="28" width="22" height="24" rx="1" fill="url(#panel)" stroke="#5a7aaa" stroke-width="0.3"/>
  <line x1="8" y1="34" x2="26" y2="34" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <line x1="8" y1="38" x2="26" y2="38" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <line x1="8" y1="42" x2="26" y2="42" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <line x1="8" y1="46" x2="26" y2="46" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <rect x="52" y="28" width="22" height="24" rx="1" fill="url(#panel)" stroke="#5a7aaa" stroke-width="0.3"/>
  <line x1="54" y1="34" x2="72" y2="34" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <line x1="54" y1="38" x2="72" y2="38" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <line x1="54" y1="42" x2="72" y2="42" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <line x1="54" y1="46" x2="72" y2="46" stroke="#5a7aaa" stroke-width="0.2" opacity="0.4"/>
  <!-- Panel connectors -->
  <rect x="26" y="30" width="4" height="20" fill="#6a7a9a"/>
  <rect x="50" y="30" width="4" height="20" fill="#6a7a9a"/>
  <!-- Main body -->
  <rect x="30" y="26" width="20" height="28" rx="3" fill="url(#body)" stroke="#7a8aaa" stroke-width="0.5"/>
  <!-- Antenna dish -->
  <line x1="40" y1="26" x2="40" y2="14" stroke="#8a9aba" stroke-width="1"/>
  <circle cx="40" cy="12" r="3" fill="none" stroke="#8a9aba" stroke-width="0.8"/>
  <circle cx="40" cy="12" r="1.5" fill="#aabbcc" opacity="0.5"/>
  <!-- Sensor/lens -->
  <circle cx="40" cy="40" r="4" fill="#1a2a4a" stroke="#4a6a8a" stroke-width="0.5"/>
  <circle cx="40" cy="40" r="2" fill="#2a4a8a" opacity="0.6"/>
  <circle cx="39" cy="39" r="0.8" fill="white" opacity="0.3"/>
  <!-- Details -->
  <rect x="34" y="30" width="12" height="3" rx="0.5" fill="#6a7a9a" opacity="0.5"/>
  <rect x="33" y="48" width="14" height="2" rx="0.5" fill="#6a7a9a" opacity="0.4"/>
  <!-- Thruster -->
  <rect x="37" y="54" width="6" height="4" rx="0.5" fill="#5a6a7a"/>
  <rect x="38" y="58" width="4" height="2" fill="#4a5a6a" opacity="0.5"/>
  <!-- Status LED -->
  <circle cx="32" cy="44" r="1" fill="#4de3ff" opacity="0.7"/>
  <circle cx="48" cy="44" r="1" fill="#4de3ff" opacity="0.5"/>
</svg>