<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50">
  <defs>
    <linearGradient id="wingGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff88cc"/>
      <stop offset="100%" stop-color="#ff44aa"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffaadd"/>
      <stop offset="100%" stop-color="#ff66bb"/>
    </linearGradient>
  </defs>
  <!-- Left upper wing -->
  <ellipse cx="20" cy="18" rx="18" ry="14" fill="url(#wingGrad1)" transform="rotate(10 20 18)"/>
  <!-- Right upper wing -->
  <ellipse cx="40" cy="18" rx="18" ry="14" fill="url(#wingGrad1)" transform="rotate(-10 40 18)"/>
  <!-- Left lower wing -->
  <ellipse cx="22" cy="30" rx="12" ry="10" fill="url(#wingGrad2)" transform="rotate(-5 22 30)"/>
  <!-- Right lower wing -->
  <ellipse cx="38" cy="30" rx="12" ry="10" fill="url(#wingGrad2)" transform="rotate(5 38 30)"/>
  <!-- Body -->
  <ellipse cx="30" cy="25" rx="2.5" ry="12" fill="#3a1a0a"/>
  <!-- Antennae -->
  <path d="M30 14 Q26 6 22 4" fill="none" stroke="#3a1a0a" stroke-width="1.2"/>
  <path d="M30 14 Q34 6 38 4" fill="none" stroke="#3a1a0a" stroke-width="1.2"/>
  <!-- Wing spots -->
  <circle cx="16" cy="16" r="3" fill="#ffddaa" opacity="0.6"/>
  <circle cx="44" cy="16" r="3" fill="#ffddaa" opacity="0.6"/>
</svg>