        function log(msg) { document.getElementById('log').textContent += msg + '\n'; }
        function status(msg, ok) { document.getElementById('status').innerHTML = `<div class="status ${ok ? 'ok' : 'err'}">${msg}</div>`; }

        document.getElementById('seedBtn').onclick = async function() {
            this.disabled = true;
            this.textContent = '⏳ Insertion en cours...';
            document.getElementById('log').textContent = '';
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { status('❌ Vous devez être connecté à Supabase. Ouvrez login.html et connectez-vous d\\'abord.', false); this.disabled = false; this.textContent = '🚀 Insérer les exemples dans Supabase'; return; }
